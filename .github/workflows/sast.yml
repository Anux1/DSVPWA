name: SAST SonarQube

on:
  push:
    branches: [ "main" ]

jobs:
  sonarqube-analysis:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run SonarQube Scan
        run: sonar-scanner -Dsonar.projectKey=tp-sast -Dsonar.sources=. -Dsonar.exclusions=venv/** -Dsonar.host.url=http://localhost:9000 -Dsonar.token=${{ secrets.SONAR_TOKEN }}
